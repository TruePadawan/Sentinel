# Kafka / Redpanda
kafka.bootstrap_servers=localhost:9092
kafka.consumer.group=sentinel-detection-group
kafka.consumer.max_poll=500
kafka.consumer.auto_offset_reset=earliest
kafka.consumer.enable_auto_commit=false

# Detector thresholds
spoof.cancel_window_ms=50
spoof.oc_ratio_threshold=10.0
spoof.oc_min_samples=20
spoof.quantity_threshold=1000

wash.window_ms=5000
wash.max_cycle_length=5

velocity.daily_notional_limit=10000000.0
velocity.minute_notional_limit=1000000.0

# Logging
logging.level.com.sentinel=INFO
